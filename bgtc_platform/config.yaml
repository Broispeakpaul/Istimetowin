# ---------------------------------------------------------------------------
# Bloomberg Global Trading Challenge 2026 - earnings catalyst platform config
# Every threshold lives here. See docs/DESIGN.md for why each default was
# chosen; items marked [PLAYBOOK?] should be checked against the playbook.
# ---------------------------------------------------------------------------

data_source: yahoo            # yahoo | bloomberg | fixture (fixture = synthetic test data)
timezone: Asia/Hong_Kong

paths:
  members: data/wls_members.csv
  positions: data/positions.csv
  earnings_overrides: data/earnings_overrides.csv
  manual_checks: data/manual_checks.csv
  account: data/account.csv
  cache_dir: data/cache
  reports_dir: reports

benchmark:
  bloomberg_ticker: "WLS Index"
  fallback_yahoo: VT            # used with a clear warning when WLS is unavailable
  vix_bloomberg: "VIX Index"
  vix_yahoo: "^VIX"
  calendar: XNYS                # calendar used to decide whether today's benchmark close should exist

history:
  lookback_calendar_days: 900   # enough for 2y weekly beta + 50d averages

entry:
  min_day_one_rel_return: 0.08
  relative_return_method: difference   # difference | ratio   [PLAYBOOK?]
  min_volume_ratio: 2.0
  volume_avg_window: 50
  min_adv_usd: 50000000
  adv_window: 50
  require_wls_member: true

themes:
  max_names_per_theme: 2
  max_weight_per_theme: 0.35
  groups:                       # themes that count as one
    semiconductors: semis_software
    software: semis_software
  scope: all                    # all | catalyst_only   [PLAYBOOK?]
  cap_mode: shrink              # shrink | reject

sizing:
  risk_budget: 0.005            # weight = risk_budget / ATR%
  atr_window: 14
  atr_method: wilder            # wilder | simple
  atr_include_day_one: true     # [PLAYBOOK?]
  min_weight: 0.04
  max_weight: 0.15
  tranche_split: [0.5, 0.5]
  second_tranche_session: 3     # day one = session 1   [PLAYBOOK?]
  block_second_tranche_in_derisk: true
  earnings_hold_risk: 0.01      # weight <= 1% / (multiplier x implied move)
  implied_move_multiplier: 1.5
  earnings_hold_lookahead_sessions: 5

competition:
  max_position_weight: 0.20     # hard rule of the challenge
  long_only: true
  allow_leverage: false

exits:
  relative_stop: -0.08
  trim_trigger: 0.18
  trim_target: 0.15
  time_stop_sessions: null      # playbook: no time stop
  core_reverse_rel_return: -0.04
  core_reverse_volume_ratio: 2.0
  core_reverse_sell_fraction: 0.5

regime:
  sma_window: 50
  vix_threshold: 25
  target_beta: 1.0

staging:
  horizon_sessions: 5
  heavyweight_top_n: 20
  recommend_cash_staging: false

calendar_view:
  horizon_sessions: 10

beta:
  years: 2
  frequency: W-FRI
  raw_weight: 0.67
  prior_weight: 0.33
  min_observations: 52

earnings:
  cache_ttl_hours: 12
  unknown_timing: both          # both | bmo | amc
  history_limit: 40             # yahoo: number of past/future report dates to request

# Bloomberg exchange code (the part after the ticker in "7203 JT Equity")
