# Bloomberg field names. Verify each with FLDS <GO> on the Terminal before first use.
bloomberg:
  price_fields: {open: PX_OPEN, high: PX_HIGH, low: PX_LOW, close: PX_LAST, volume: PX_VOLUME}
  currency_field: CRNCY
  fx_ticker_template: "{ccy}USD Curncy"
  members_field: INDX_MWEIGHT
  earnings_history_field: EARN_ANN_DT_TIME_HIST_WITH_EPS   # verify with FLDS
  expected_report_date_field: EXPECTED_REPORT_DT           # verify with FLDS
  expected_report_time_field: EXPECTED_REPORT_TIME         # verify with FLDS
  implied_move_field: null      # set if your Terminal has an implied earnings move field

backtest:
  initial_capital: 1000000      # [check challenge rules]
  contest_weeks: 5
  cost_bps: 10                  # [check challenge rules]
  idle_cash: benchmark_proxy    # benchmark_proxy | cash
  manual_checks_assumption: pass
  implied_move_proxy_reports: 8
  forward_horizons: [1, 5, 10, 20, 25]
  reaction_buckets: [-1.0, -0.08, -0.04, 0.0, 0.04, 0.08, 0.12, 10.0]
